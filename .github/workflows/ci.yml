name: ci

on:
  push:
    branches: [main, 'build/**']
  pull_request:
    branches: [main]

jobs:
  check:
    # Troy's tests launch a real Electron window and drive real navigations,
    # so they run on each platform it ships on rather than on one and a hope.
    # GitHub has retired its Intel Mac runners, so there is no honest way to
    # run this suite on Intel hardware here. The Intel build is covered where
    # it still can be: the release workflow packages it and starts it under
    # Rosetta, which catches a broken or unlaunchable x86_64 app.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fetch both browser binaries up front. npm ci does not download
      # Electron's, and Playwright ships no browsers with the npm package, so
      # without this the first test to need either downloads it mid-run.
      - name: Fetch the Electron binary
        run: node node_modules/electron/install.js

      - name: Fetch Playwright's chromium
        run: npx playwright install --with-deps chromium

      - run: npm run lint
      - run: npm run typecheck

      # Linux runners have no display, and an Electron window needs one.
      - name: Test
        if: runner.os != 'Linux'
        run: npm test

      - name: Test under xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm test
