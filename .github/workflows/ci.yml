name: ci

on:
  push:
    branches: [main, 'build/**']
  pull_request:
    branches: [main]

jobs:
  check:
    # Troy's tests launch a real Electron window and drive real navigations,
    # so they run on each platform it ships on rather than on one and a hope.
    # Both Mac architectures, not just the one that happens to build the
    # release: macos-latest is Apple silicon and macos-13 is Intel, and a
    # browser is exactly the kind of program that can differ between them.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-13, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fetch both browser binaries up front. npm ci does not download
      # Electron's, and Playwright ships no browsers with the npm package, so
      # without this the first test to need either downloads it mid-run.
      - name: Fetch the Electron binary
        run: node node_modules/electron/install.js

      - name: Fetch Playwright's chromium
        run: npx playwright install --with-deps chromium

      - run: npm run lint
      - run: npm run typecheck

      # Linux runners have no display, and an Electron window needs one.
      - name: Test
        if: runner.os != 'Linux'
        run: npm test

      - name: Test under xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm test
