<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Troy fixture: hidden text</title>
<style>
  body { font-family: system-ui; margin: 40px; background: #ffffff; color: #111111; }
  .none-trap { display: none; }
  .clip-trap { height: 0; overflow: hidden; }
  .white-trap { color: #ffffff; background: #ffffff; }
</style>
</head>
<body>
<p id="visible">The Hollowmere signal held steady at forty two decibels through the storm.</p>
<p class="none-trap">Grackle Ninefold Cipher Alpha</p>
<div class="clip-trap"><p>Wraithcap Ledger Nine Six Two</p></div>
<p class="white-trap">Salted Obelisk Protocol Zero</p>
</body>
</html>
