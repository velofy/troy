<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<title>Troy Palette</title>
<link rel="stylesheet" href="palette.css">
</head>
<body>
  <main class="palette" role="dialog" aria-modal="true" aria-label="Troy command palette">
    <label class="search">
      <span class="magnifier" aria-hidden="true"></span>
      <input id="query" type="text" autocomplete="off" spellcheck="false"
             role="combobox" aria-expanded="true" aria-controls="results"
             aria-autocomplete="list" placeholder="Search tabs, bookmarks, history, or run a command">
      <kbd>esc</kbd>
    </label>
    <div id="results" class="results" role="listbox" aria-label="Palette results"></div>
    <p id="empty" class="empty" hidden>No matching command or page</p>
    <footer>
      <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>⇧↵</kbd> new tab</span>
    </footer>
  </main>
  <script src="palette.js"></script>
</body>
</html>
