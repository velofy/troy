<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data: https: http:">
<title>Troy</title>
<link rel="stylesheet" href="chrome.css">
</head>
<body>
  <div class="tabstrip" id="tabstrip">
    <div class="traffic-spacer"></div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Open tabs"></div>
    <button class="newtab" id="newtab" title="New tab (Cmd T)" aria-label="New tab">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.4v9.2M3.4 8h9.2"/></svg>
    </button>
  </div>

  <div class="toolbar">
    <!-- Icons on a 16 grid with a 1.5 stroke and round joins, the Photon
         proportions, so they read as one set rather than as clip art. -->
    <button class="nav" id="back" title="Back" aria-label="Back">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8H3.2M7.4 3.6 3 8l4.4 4.4"/></svg>
    </button>
    <button class="nav" id="forward" title="Forward" aria-label="Forward">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8h10.3M8.6 3.6 13 8l-4.4 4.4"/></svg>
    </button>
    <button class="nav" id="reload" title="Reload" aria-label="Reload">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 8a5.2 5.2 0 1 1-1.6-3.75M13.4 2.6v3.9H9.5"/></svg>
    </button>

    <div class="omnibox">
      <svg class="omni-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7.1" cy="7.1" r="4.3"/><path d="M13.4 13.4l-3.1-3.1"/></svg>
      <input id="omni" type="text" spellcheck="false" autocomplete="off"
             aria-label="Search or enter address" placeholder="Search or enter address">
    </div>

    <button class="agent" id="panel" title="Agent panel (Cmd Shift A)" aria-label="Toggle agent panel">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="16" cy="16" r="9.4"/>
          <path d="M16 12 L24.14 11.3"/><path d="M12.54 18 L7.86 11.3"/><path d="M19.46 18 L16 25.4"/>
        </g>
        <path d="M16 12 L19.46 18 H12.54 Z" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <!-- Sits on the seam between the chrome and the page, so it reads as the
       page loading rather than as a widget in the toolbar. -->
  <div class="progress" id="progress" role="progressbar" aria-hidden="true"></div>

  <p class="notice" id="notice" role="status" hidden></p>

  <aside class="panel" id="agentpanel" aria-label="Troy agent" hidden>
    <div class="panel-head">
      <span class="panel-title">agent</span>
      <div class="panel-actions">
        <button id="readbtn" class="panel-action">read page</button>
        <button id="clearagent" class="panel-action">clear</button>
      </div>
    </div>

    <section class="agent-settings" aria-label="Agent settings">
      <label>provider
        <select id="agentprovider">
          <option value="anthropic">Anthropic</option>
          <option value="openai">OpenAI</option>
          <option value="openrouter">OpenRouter</option>
        </select>
      </label>
      <label>model
        <input id="agentmodel" type="text" autocomplete="off" spellcheck="false" maxlength="160">
      </label>
      <form id="keyform" class="key-row">
        <label class="key-field">API key
          <input id="agentkey" type="password" autocomplete="off" spellcheck="false" maxlength="4096" placeholder="stored with OS encryption">
        </label>
        <button type="submit" class="panel-action">save</button>
        <button type="button" id="clearkey" class="panel-action">remove</button>
      </form>
      <p id="keystatus" class="setting-status" role="status"></p>
    </section>

    <div id="agentscopes" class="agent-scopes" aria-label="Allowed origins"></div>
    <div id="agentstatus" class="agent-status" role="status" aria-live="polite"></div>
    <div id="conversation" class="conversation" role="log" aria-live="off" aria-label="Agent conversation"></div>
    <div id="agentboundary" class="agent-boundary" hidden>
      <p id="boundarytext"></p>
      <button id="grantorigin" class="panel-action">allow for this session</button>
    </div>
    <details id="readpreview" class="read-preview" hidden>
      <summary>page read</summary>
      <pre id="readoutput"></pre>
    </details>

    <form id="agentcomposer" class="agent-composer">
      <label class="sr-only" for="agentinput">Tell Troy what to do</label>
      <textarea id="agentinput" rows="3" maxlength="8000" placeholder="Ask Troy to browse this tab…"></textarea>
      <div class="composer-actions">
        <button type="button" id="micbtn" class="micbtn" aria-pressed="false" disabled title="Push-to-talk is installed in the next step">hold to talk</button>
        <button type="submit" id="agentsend" class="sendbtn">send</button>
      </div>
      <button type="button" id="agentstop" class="stopbtn" hidden>stop agent <span>⌘.</span></button>
    </form>
  </aside>

  <script src="chrome.js"></script>
  <script src="agent-panel.js"></script>
</body>
</html>
