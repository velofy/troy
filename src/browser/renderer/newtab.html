<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self' data:; form-action 'self'">
<title>New Tab</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main class="wrap">
    <svg class="mark" viewBox="0 0 32 32" role="img" aria-label="Troy">
      <g fill="none" stroke="#d97757" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.4 10.6 V2.4 H10.6"/>
        <path d="M29.6 21.4 V29.6 H21.4"/>
        <circle cx="16" cy="16" r="9.4"/>
        <path d="M16 12 L24.14 11.3"/>
        <path d="M12.54 18 L7.86 11.3"/>
        <path d="M19.46 18 L16 25.4"/>
      </g>
      <path d="M16 12 L19.46 18 H12.54 Z" fill="#d97757"/>
    </svg>
    <p class="name">troy</p>

    <!--
      A plain GET form, with no script on this page at all.

      Submitting navigates this tab to newtab.html?q=..., which the main
      process catches in will-navigate, cancels, and hands to the same
      resolver the address bar uses. So this box refuses javascript: and
      friends for exactly the same reasons the address bar does, with one
      copy of the rules, and the page itself gains no privilege: it has no
      preload, no IPC, and nothing to reach for.
    -->
    <form class="search" method="get" action="newtab.html" role="search">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="q" name="q" type="text" autofocus autocomplete="off" spellcheck="false"
             aria-label="Search or enter address" placeholder="Search or enter address">
    </form>

    <p class="hints">
      <span><kbd>Cmd</kbd><kbd>L</kbd> address bar</span>
      <span><kbd>Cmd</kbd><kbd>T</kbd> new tab</span>
      <span><kbd>Cmd</kbd><kbd>Shift</kbd><kbd>A</kbd> agent panel</span>
    </p>
  </main>
</body>
</html>
