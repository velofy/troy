<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
<title>New Tab</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #202124;
    color: #e8eaed;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: grid;
    place-items: center;
    user-select: none;
  }
  .wrap { text-align: center; transform: translateY(-6vh); }
  .mark { width: 64px; height: 64px; margin: 0 auto 18px; display: block; }
  .name {
    margin: 0 0 4px;
    font-size: 15px;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: #e8eaed;
  }
  .tag { margin: 0; color: #9aa0a6; font-size: 12px; }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 32 32" role="img" aria-label="Troy">
      <g fill="none" stroke="#d97757" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.4 10.6 V2.4 H10.6"/>
        <path d="M29.6 21.4 V29.6 H21.4"/>
        <circle cx="16" cy="16" r="9.4"/>
        <path d="M16 12 L24.14 11.3"/>
        <path d="M12.54 18 L7.86 11.3"/>
        <path d="M19.46 18 L16 25.4"/>
      </g>
      <path d="M16 12 L19.46 18 H12.54 Z" fill="#d97757"/>
    </svg>
    <p class="name">troy</p>
    <p class="tag">a browser an agent can actually read</p>
  </div>
</body>
</html>
