<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
<title>Cannot open this page</title>
<link rel="stylesheet" href="error.css">
</head>
<body>
  <main class="wrap">
    <svg class="mark" viewBox="0 0 32 32" role="img" aria-label="Troy">
      <g fill="none" stroke="#5f6368" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.4 10.6 V2.4 H10.6"/>
        <path d="M29.6 21.4 V29.6 H21.4"/>
        <circle cx="16" cy="16" r="9.4"/>
      </g>
    </svg>
    <h1 id="headline">This page did not load</h1>
    <p class="url" id="url"></p>
    <p class="reason" id="reason"></p>
    <button id="retry" class="retry">Try again</button>
  </main>
  <script src="error.js"></script>
</body>
</html>
